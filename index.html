<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7ece2" />
    <!-- CUSTOMIZE: Browser tab title（由 config.js 的 pageTitle 覆盖） -->
    <title>和你一起玩 💕</title>
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/intro.css" />
    <link rel="stylesheet" href="vendor/glightbox.min.css" />
  </head>
  <body class="intro-active">
    <!-- Site 级动态背景（第一屏与后续页面共用，js/intro.js 驱动） -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Floating Petals（替代母版 emoji 漂浮元素，由 JS 生成） -->
    <div class="floating-elements" aria-hidden="true"></div>

    <!-- Main Content Container -->
    <main class="container">
      <h1 id="valentineTitle"></h1>

      <!-- Music Player（音乐源为本地 ./assets/audio/bgm.mp3） -->
      <div id="musicControls" class="music-controls">
        <button
          id="musicToggle"
          class="music-btn"
          aria-label="Toggle Background Music"
        >
          放音乐
        </button>
        <audio id="bgMusic" loop>
          <source id="musicSource" type="audio/mpeg" />
          Your browser does not support the audio element.
        </audio>
      </div>

      <!-- Step 1 — 首页 -->
      <section class="question-section" id="question1">
        <h2 id="homeTitle"></h2>
        <p class="home-sub" id="homeSubtitle"></p>
        <div class="button-group">
          <button class="cute-btn" onclick="showNextQuestion(2)" id="homeStartBtn"></button>
        </div>
      </section>

      <!-- Step 2 — 小游戏1：默契测试 -->
      <section class="question-section hidden" id="question2">
        <h2 id="quizText"></h2>
        <div class="option-group" id="quizOptions"></div>
        <p class="game-feedback" id="quizFeedback"></p>
        <div class="button-group">
          <button class="cute-btn hidden" onclick="showNextQuestion(3)" id="quizNextBtn"></button>
        </div>
      </section>

      <!-- Step 3 — 小游戏2：Love Meter -->
      <section class="question-section hidden" id="question3">
        <h2 id="meterText"></h2>
        <div class="love-meter">
          <label for="loveMeter" class="sr-only">Love Meter</label>
          <input
            type="range"
            min="0"
            max="10000"
            value="100"
            class="slider"
            id="loveMeter"
          />
          <p>
            <span class="love-value-container"
              ><span id="startText"></span> (<span id="loveValue">100</span
              >%)</span
            >
            <span id="extraLove" class="hidden"></span>
          </p>
        </div>
        <button class="cute-btn" onclick="finishMeter()" id="meterNextBtn"></button>
      </section>

      <!-- Step 4 — 小游戏3：随机问题 -->
      <section class="question-section hidden" id="question4">
        <h2 class="random-text" id="randomQuestionText"></h2>
        <div class="button-group">
          <button class="cute-btn" onclick="nextRandomQuestion()" id="questionAgainBtn"></button>
          <button class="cute-btn" onclick="showNextQuestion(5)" id="questionNextBtn"></button>
        </div>
      </section>

      <!-- Step 5 — 小游戏4：随机小任务 -->
      <section class="question-section hidden" id="question5">
        <h2 id="smallThingsTitle"></h2>
        <p class="random-text" id="smallThingText"></p>
        <div class="button-group">
          <button class="cute-btn" onclick="nextSmallThing()" id="smallThingAgainBtn"></button>
          <button class="cute-btn" onclick="showNextQuestion(6)" id="smallThingNextBtn"></button>
        </div>
      </section>

      <!-- Step 6 — 照片（展示区预留：后续可替换为全息卡片组件，数据接口不变） -->
      <section class="question-section hidden" id="question6">
        <div class="photo-stage" id="photoStage"></div>
        <p class="photo-caption" id="photoCaption"></p>
        <div class="button-group">
          <button class="cute-btn" onclick="prevPhoto()" id="photoPrevBtn">上一张</button>
          <button class="cute-btn" onclick="showNextQuestion(7)" id="photoNextBtn"></button>
        </div>
      </section>

      <!-- Step 7 — 随机惊喜 -->
      <section class="question-section hidden" id="question7">
        <div class="button-group">
          <button class="cute-btn surprise-gift" onclick="nextSurprise()" id="surpriseBtn"></button>
        </div>
        <p class="game-feedback surprise-text" id="surpriseText"></p>
        <div class="button-group">
          <button class="cute-btn hidden" onclick="nextSurprise()" id="surpriseAgainBtn"></button>
          <button class="cute-btn hidden" onclick="celebrate()" id="surpriseNextBtn"></button>
        </div>
      </section>

      <!-- 结束页（Celebration + 花瓣庆祝） -->
      <section class="celebration hidden" id="celebration">
        <h2 id="celebrationTitle"></h2>
        <p class="celebration-text" id="celebrationMessage"></p>
        <p class="celebration-text" id="celebrationEmojis"></p>
        <div class="button-group">
          <button class="cute-btn" onclick="replayGame()" id="replayBtn"></button>
        </div>
      </section>

      <!-- Share Button（母版原有，保留） -->
      <div class="share-container">
        <button
          id="shareBtn"
          class="share-btn"
          aria-label="Copy shareable link"
        >
          复制本页链接
        </button>
      </div>
    </main>

    <!-- 第一屏开场（A 暖奶油背景 + Redouté《Les Roses》铜版画，公有领域） -->
    <div id="intro-overlay">
      <div class="intro-rose" aria-hidden="true">
        <img src="./assets/art/redoute-gallica-bloom.webp" alt="" />
      </div>
      <div class="intro-copy">
        <h1 class="intro-title">我们的小小世界</h1>
        <p class="intro-sub">A little world, just for us.</p>
        <button id="introEnter" class="intro-enter" type="button">进　入</button>
      </div>
      <button id="introMusic" class="intro-music" type="button" aria-label="切换音乐">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l10-2v13" />
          <circle cx="6.5" cy="18" r="2.5" />
          <circle cx="16.5" cy="16" r="2.5" />
          <path class="wave-2" d="M21.5 8.5c.8-1.6.8-3.4 0-5" />
        </svg>
      </button>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="config-system.js"></script>
    <script src="state.js"></script>
    <script src="theme.js"></script>
    <script src="vendor/glightbox.min.js"></script>
    <script src="script.js"></script>
    <script type="module" src="js/intro.js"></script>
  </body>
</html>
